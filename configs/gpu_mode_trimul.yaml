# Complete standalone configuration. No shared defaults file is merged.

# TriMul's two-B200 path uses both cards for generation, then releases both
# independent TP=1 engines for one benchmark at a time on each GPU.
hardware_profile: B200_full_ram

# --- problem / targets ---
problem: gpu_mode
problem_type: trimul
task_yaml: examples/gpu_mode/lib/bioml/trimul/task.yml
lib_dir: examples/gpu_mode/lib
target: 550
fail_score: 0.0

# reward = 1.0 / (0.23952553277 * raw_score + 0.02094893446)
# reward = 44400 / (t + 15700) if t >= 2800 else 135000 / (13 * t + 19850)

# --- models / training backend ---
coder_model_name: openai/gpt-oss-120b
coder_reasoning_effort: high

# Qwen3.8-27B alternative
# coder_model_name: Qwen/Qwen3.8-27B
# coder_reasoning_effort: low

backend: auto
load_in_4bit: false

# --- LoRA adapters ---
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- rollout budget ---
num_steps: 100
groups_per_step: 6
group_size: 6

# --- parent selection ---
# puct = original picker; uct = no rank prior.
# Parent count is groups_per_step.
parent_selection: puct
num_seed_states: 8
# Match TTT-Discover's empty initial TriMul program. Eight equivalent roots
# are required because this sampler selects eight distinct parent states.
seed_from_reference: false
puct_c: 1.0
max_buffer_size: 2000
topk_children_per_parent: 13

# --- optimizer / training batches ---
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
grad_clip: 1.0
logprob_chunk: auto

# --- advantage / regularization ---
kl_penalty_coef: 0.1
spo_rs_beta: 2.0
hybrid_ttt_weight: 1.0
hybrid_spo_weight: 1.0

# --- coder sampling ---
temperature: 1.0
top_p: 1.0
top_k: 0
thinking: true

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
available_gpu_ids: ''
training_gpu_id: 0
gpu_ids: ''
num_gpus: null
evaluation_gpu_id: null
reserve_last_gpu_for_evaluation: false
sequential_generation: false
evaluation_shares_generation: false

# --- coder generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: false
vllm_quantization: ''
vllm_gpu_memory_utilization: auto
vllm_max_num_batched_tokens: auto
vllm_enable_prefix_caching: true
vllm_enforce_eager: false
vllm_sleep_level: 1
vllm_staged_loading: true

# --- reproducibility ---
deterministic: false
seed: 42

# --- evaluation ---
# GPU Mode reference-kernels b239d59899f04407cd9f6275507d9a5651e21692
gpu_type: B200
triton_version: 3.3.1
# Dedicated sibling environment on B200 (the directory is named kenrel_env).
kernel_python: ../kenrel_env/bin/python3
gpu_lease_timeout_s: 0
kernel_timeout_s: 1200  # TTT-Discover's Modal runner deadline.
sandbox_timeout_s: 100
reward_workers: 2  # Derived at startup: one benchmark at a time per available GPU.

# --- logging / saved outputs ---
print_responses: 0
max_saved_construction: 40960
kernel_log_chars: 4000
