# Complete standalone configuration. No shared defaults file is merged.

# B200 = transient inference workers; B200_full_ram = RTX-style RAM residency.
# Launch-scoped, including resume. Uses detected GPU/RAM/CPU capacity.
# B200 prefers matching local checkpoints under /root/nas/Mohammad/models/.
hardware_profile: B200_full_ram

# --- problem / targets ---
problem: ac1
problem_type: ac1
# Display/SOTA threshold. It is deliberately separate from the prompt target,
# even while both values are identical.
target_print: 1.5027
# target_print: 1.50274349
target: 1.5027
fail_score: 0.0

# --- models / training backend ---
# Qwen3.8-27B alternative
# coder_model_name: Qwen/Qwen3.8-27B
# coder_reasoning_effort: low
coder_model_name: openai/gpt-oss-120b
coder_reasoning_effort: high
backend: auto
load_in_4bit: false


# --- LoRA adapters ---
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# --- rollout budget ---
num_steps: 20
groups_per_step: 4
group_size: 10
frozen_programs_per_parent: 1

# --- parent selection ---
# puct = original picker; uct = no rank prior.
# Parent count is groups_per_step.
# parent_selection: puct-jev
parent_selection: puct
# PUCT-JEV: consider only the top X * groups_per_step candidates.
jev_candidate_multiplier: 4
# Reject a candidate when P(same core idea) reaches this threshold.
jev_same_core_threshold: 0.5
num_seed_states: 8
puct_c: 1.0
max_buffer_size: 2000
topk_children_per_parent: 14

# --- optimizer / training batches ---
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
weight_decay: 0.0
grad_clip: 1.0
logprob_chunk: auto

# --- advantage / regularization ---
kl_penalty_coef: 0.1
spo_rs_beta: 2.0
hybrid_sibling_weight: 0.10

# --- coder sampling ---
temperature: 1
top_p: 1
top_k: 0
min_p: 0
thinking: true

# --- frozen solver sampling ---
# Auto uses the model context limit and generation subtracts prompt tokens.
strategy_max_seq_length: auto
strategy_max_new_tokens: auto
# Unfiltered frozen solver sampling.
strategy_temperature: 1
strategy_top_p: 1
strategy_top_k: 0
strategy_min_p: 0

# --- GPU roles (resolved from run.sh AVAILABLE_GPUS) ---
available_gpu_ids: ''
training_gpu_id: 0
gpu_ids: ''
num_gpus: null
evaluation_gpu_id: null
reserve_last_gpu_for_evaluation: false
sequential_generation: false
evaluation_shares_generation: false

# --- coder generation engine ---
generation_backend: vllm
gen_micro_batch: auto
vllm_tensor_parallel_size: 0
vllm_pipeline_parallel_size: 1
vllm_enable_expert_parallel: false
vllm_quantization: ''
vllm_gpu_memory_utilization: auto
vllm_max_num_batched_tokens: auto
vllm_enable_prefix_caching: true
vllm_enforce_eager: false
vllm_sleep_level: 1
vllm_staged_loading: false

# --- strategy generation engine ---
strategy_vllm_quantization: ''
strategy_vllm_sleep_level: 1
strategy_vllm_staged_loading: false

# --- reproducibility ---
deterministic: false
seed: 42

# --- evaluation ---
budget_s: 1100
eval_cpus: 100
sandbox_timeout_s: 1200
reward_workers: 2

# --- logging / saved outputs ---
print_responses: 0
max_saved_construction: 819200
